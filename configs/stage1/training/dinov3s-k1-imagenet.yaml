stage_1:
  target: stage1.RAE
  params:
    encoder_name: dinov3-vit-s16
    resolution: 256
    decoder_config_path: configs/decoder/ViTB
    noise_tau: 0.8

dataset:
  target: imagenet
  type: folder
  data_dir: /work/nvme/bikv/jmahajan/imagenet-1k
  split: train
  condition_type: label
  shared_tmpdir: /work/hdd/bibd/jmahajan/raev2/tmp  # eval NPZ shards (~10GB per eval); default ~/tmp is in the home quota

training:
  epochs: 16
  ema_decay: 0.9978
  batch_size: 64  # per GPU; global batch = batch_size x total GPUs (all nodes)
  num_workers: 16  # per GPU; ~2x the throughput training needs on 4 GPUs (8 starves slightly, >24 is disk-bound)
  clip_grad: 0.0
  log_interval: 100
  checkpoint_interval: 1
  keep_last_checkpoints: 1  # only the newest (resume point, and the final one at the end) is kept
  sample_every: 2500
  image_size: 256
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 16
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true

eval:
  eval_interval: 2500
  eval_model: false
  eval_dir: /work/hdd/bibd/jmahajan/raev2/results/stage1/eval
  datasets:
    imagenet:
      type: folder
      data_dir: /work/nvme/bikv/jmahajan/imagenet-1k
      split: val
      condition_type: label
      reference_npz: /work/hdd/bibd/jmahajan/raev2/data/imagenet-256-val.npz
      metrics: [psnr, ssim, rfid]

gan:
  arch:
    dino_ckpt_path: /work/hdd/bibd/jmahajan/raev2/pretrained_models/encoders/dino/dino_vit_small_patch8_224.pth
    ks: 9
    norm_type: bn
    using_spec_norm: true
    recipe: S_8
  optimizer:
    lr: 2.0e-4
    betas: [0.9, 0.95]
    weight_decay: 0.0
  scheduler:
    type: cosine
    warmup_epochs: 1
    decay_end_epoch: 16
    base_lr: 2.0e-4
    final_lr: 2.0e-5
    warmup_from_zero: true
  augment:
    prob: 1.0
    cutout: 0.0
  loss:
    disc_loss: hinge
    gen_loss: vanilla
    disc_weight: 0.75
    perceptual_weight: 1.0
    disc_start: 8
    disc_upd_start: 6
    lpips_start: 0
    max_d_weight: 10000.0
    disc_updates: 1
